<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Highfield Assembly Admin</title>
<link rel="icon" href="images/paoz-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap">
<style>
/* Admin: same PAOZ green/white identity as the site; sidebar of sections allowed by the user's roles, list + form panel on the right. */
:root{
  --bg:#ffffff; --surface:#f3f8f4; --ink:#0b2a1a; --muted:#4f6357; --line:#d8e6dc;
  --green:#0a7a3d; --panel:#06301b; --soft:#e3f3e8; --gold:#f5d313; --red:#e2231a; --warn:#a15c00; --warn-bg:#fff4d6;
  --display:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.15}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:10;background:var(--panel);color:#fff;border-bottom:4px solid var(--gold);padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;background:#fff;border-radius:50%;padding:3px;object-fit:contain}
.top .t{font-family:var(--display);font-weight:600}
.top .t small{display:block;font-weight:400;opacity:.75;font-size:12px}
.top .sp{flex:1}
.top .who{font-size:13px;opacity:.85;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top a,.top button{color:#fff}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:9px 16px;font:600 14px var(--display);cursor:pointer;text-decoration:none;background:var(--ink);color:#fff}
.btn:hover{background:var(--green)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.light{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.light:hover{border-color:var(--green);color:var(--green)}
.btn.danger{background:#fff;color:var(--red);border-color:#f3c3c0}
.btn.danger:hover{background:var(--red);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:progress}

.center{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:24px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.gate{max-width:440px;text-align:center;display:grid;gap:14px;justify-items:center}
.gate img{width:72px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.ok{background:var(--soft);color:var(--green);border-radius:12px;padding:12px 14px;font-size:14px}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 70px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;display:grid;align-content:start;gap:2px}
.side button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font:500 14.5px var(--display)}
.side button:hover{background:var(--surface)}
.side button[aria-current="page"]{background:var(--soft);color:var(--green);font-weight:600}
.side .count{font:600 12px var(--display);background:var(--red);color:#fff;border-radius:999px;padding:1px 8px}
.side .grp{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 14px 4px}
.main{padding:24px max(16px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head p{margin:4px 0 0}

.list{display:grid;gap:10px}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center}
.row.noimg{grid-template-columns:minmax(0,1fr) auto}
.row .th{width:56px;height:56px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--green);font:600 18px var(--display)}
.row .th img{width:100%;height:100%;object-fit:cover}
.row h3{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .txt{font-size:14px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;font:600 11px var(--display);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--green);margin-left:6px;vertical-align:middle}
.badge.new{background:var(--red);color:#fff}
.badge.priv{background:var(--panel);color:#fff}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

.form{margin-bottom:22px;display:grid;gap:14px}
.form h2{font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
label.f{display:grid;gap:6px;font:600 13.5px var(--display)}
label.f .hint{font:400 12.5px var(--body);color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font:500 14px var(--display)}
.check input{width:18px;height:18px}
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgf .pv{width:96px;height:72px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.imgf .pv img{width:100%;height:100%;object-fit:cover}
.form .acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{max-width:260px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:#fff}
.drop.over{border-color:var(--green);background:var(--soft)}
.progress{font-size:13px;color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font:600 14px var(--display);z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.roles{display:flex;flex-wrap:wrap;gap:8px 16px}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px}
  .side .grp{display:none}
  .side button{white-space:nowrap}
  .main{padding:18px 16px 60px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:48px minmax(0,1fr)}
  .row .th{width:48px;height:48px}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
  .row.noimg .acts{grid-column:auto}
  .top .who{display:none}
}
</style>
</head>
<body>
<header class="top">
  <img src="images/paoz-logo.png" alt="">
  <div class="t">PAOZ Highfield Assembly<small>Website admin</small></div>
  <div class="sp"></div>
  <span class="who" id="who"></span>
  <a class="btn ghost sm" href="./" target="_blank" rel="noopener">View site</a>
  <button class="btn ghost sm" id="signOut" type="button" hidden>Sign out</button>
</header>

<div class="center" id="gate">
  <div class="card gate" id="gateBox">
    <img src="images/paoz-logo.png" alt="PAOZ logo">
    <h1>Loading…</h1>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="side" id="side" aria-label="Admin sections"></nav>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="js/cms-config.js"></script>
<script src="js/site-data.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
